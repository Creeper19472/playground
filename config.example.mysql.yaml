# Playground Server Configuration - MySQL Example
# Configuration for using MySQL database

server:
  host: "0.0.0.0"
  port: 8080

database:
  type: "mysql"                # Database type
  host: "localhost"            # MySQL server host
  port: 3306                   # MySQL server port
  name: "playground"           # Database name
  user: "playground_user"      # Database user
  password: "your_password"    # Database password
  max_open_conns: 100
  max_idle_conns: 10
