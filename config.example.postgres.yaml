# Playground Server Configuration - PostgreSQL Example
# Configuration for using PostgreSQL database

server:
  host: "0.0.0.0"
  port: 8080

database:
  type: "postgres"             # Database type
  host: "localhost"            # PostgreSQL server host
  port: 5432                   # PostgreSQL server port
  name: "playground"           # Database name
  user: "playground_user"      # Database user
  password: "your_password"    # Database password
  ssl_mode: "disable"          # SSL mode: disable, require, verify-ca, verify-full
  max_open_conns: 100
  max_idle_conns: 10
